# Serves the Vite build output as a single-page app: any path that isn't a
# real static file falls back to index.html so client-side routing
# (react-router-dom's BrowserRouter) can handle it - without this, refreshing
# on e.g. /accounts/3 would 404 at the server instead of reaching React.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
