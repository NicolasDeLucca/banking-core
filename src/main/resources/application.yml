spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bankingcore}
    username: ${DB_USER:bankingcore}
    # No default: must come from the environment (see .env.example). A placeholder
    # here - even an obvious dev one - reads as a hardcoded secret to scanners
    # (and to anyone skimming the repo), so this is intentionally required.
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  lifecycle:
    # Stop accepting new requests, let in-flight ones finish, then force-close -
    # instead of Docker's SIGTERM cutting a request off mid-flight (docker-compose
    # gives containers 10s by default before SIGKILL; keep this comfortably under that).
    timeout-per-shutdown-phase: 8s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # health is exposed by default; info/metrics are opt-in and, per
        # SecurityConfig, require ADMIN (unlike health, which stays public
        # for the Docker HEALTHCHECK).
        include: health, info, metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          # Default readiness group is just the readinessState flag - adding
          # db makes the Docker HEALTHCHECK (which targets /readiness, see
          # Dockerfile) actually verify the app can reach Postgres, not just
          # that the JVM booted.
          include: readinessState, db
  info:
    build:
      enabled: true

logging:
  pattern:
    # Slots into Boot's default console pattern (right after the log level)
    # rather than redefining the whole thing - see shared.web.CorrelationIdFilter.
    # Empty/absent for log lines outside a request (startup, the admin seeder).
    level: "%5p [%X{requestId:-}]"

app:
  jwt:
    # No default on purpose - see DB_PASSWORD above. Must be a long random value.
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:10800}
  admin:
    # Seeded on startup if no user with this email exists yet. No default password
    # on purpose - see DB_PASSWORD above.
    email: ${ADMIN_EMAIL:admin@bankingcore.local}
    password: ${ADMIN_PASSWORD}
  cors:
    # Comma-separated. Defaults to the frontend's local Vite dev server.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    login:
      # Failed-login lockout (per email, in-memory - see InMemoryLoginAttemptGuard).
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      window-minutes: ${LOGIN_WINDOW_MINUTES:15}
      lockout-minutes: ${LOGIN_LOCKOUT_MINUTES:15}
