spring:
  datasource:
    url: jdbc:h2:mem:bankingcore;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true

server:
  port: 8080

app:
  jwt:
    # minimum recommended length for HS256 key
    secret: "replace-this-with-a-very-long-dev-secret-at-least-32-chars"
    expiration-seconds: 10800