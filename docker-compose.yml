services:
  db:
    image: postgres:16-alpine
    container_name: banking-core-db
    environment:
      POSTGRES_DB: ${DB_NAME:-bankingcore}
      POSTGRES_USER: ${DB_USER:-bankingcore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file (copy .env.example)}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - banking-core-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bankingcore}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: banking-core-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-bankingcore}
      DB_USER: ${DB_USER:-bankingcore}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file (copy .env.example)}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file (copy .env.example) - use a long random value}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-10800}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bankingcore.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in your .env file (copy .env.example)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_WINDOW_MINUTES: ${LOGIN_WINDOW_MINUTES:-15}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the JS bundle at build time (Vite), not read at
        # container start. Defaults to the app service's host-published
        # port, since the browser reaches both services via localhost, not
        # via Docker's internal network. Override if APP_PORT is not 8080.
        VITE_API_BASE_URL: http://localhost:${APP_PORT:-8080}
    container_name: banking-core-frontend
    depends_on:
      app:
        condition: service_healthy
    ports:
      # 5173 by default so it lines up with app's CORS_ALLOWED_ORIGINS
      # default (see application.yml / .env.example) with zero extra config.
      # Container-side is 8080, not 80: nginx-unprivileged (see
      # frontend/Dockerfile) can't bind the privileged port 80 as a
      # non-root user.
      - "${FRONTEND_PORT:-5173}:8080"

volumes:
  banking-core-db-data:
