name: CI

on:
  push:
    branches: ["master", "develop"]
  pull_request:
    branches: ["master", "develop"]
  workflow_dispatch:

# Cancel superseded runs on the same branch (e.g. pushing twice in a row)
# instead of letting both finish - saves CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      # Tests run against H2 (src/test/resources/application.yml), so no
      # database service container is needed here.
      - name: Run tests
        run: mvn -B clean test

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "target/surefire-reports/TEST-*.xml"
          annotate_only: true

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Layer-cached via GitHub Actions cache, so the Maven dependency layer
      # (the slowest part of the Dockerfile) isn't rebuilt from scratch on
      # every run - only when pom.xml or src/ actually change.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: banking-core:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
