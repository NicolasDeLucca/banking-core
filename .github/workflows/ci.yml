name: CI

on:
  push:
    branches: ["master", "develop"]
  pull_request:
    branches: ["master", "develop"]
  workflow_dispatch:

# Cancel superseded runs on the same branch (e.g. pushing twice in a row)
# instead of letting both finish - saves CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build, Test & Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      # Tests run against H2 (src/test/resources/application.yml), so no
      # database service container is needed here. `verify` also runs, in
      # order: JaCoCo coverage report (informational, no minimum threshold -
      # this project deliberately doesn't chase 100% coverage) and PMD static
      # analysis (this one *does* gate the build - see pmd-ruleset.xml for
      # what's checked and why specific findings are excluded/suppressed).
      - name: Build, test, lint & coverage
        run: mvn -B clean verify

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "target/surefire-reports/TEST-*.xml"
          annotate_only: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment coverage on PR
        if: always() && github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7
        with:
          paths: target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Coverage report
          min-coverage-overall: 0
          min-coverage-changed-files: 0

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload PMD report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-report
          path: target/pmd.xml
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Layer-cached via GitHub Actions cache, so the Maven dependency layer
      # (the slowest part of the Dockerfile) isn't rebuilt from scratch on
      # every run - only when pom.xml or src/ actually change.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: banking-core:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
